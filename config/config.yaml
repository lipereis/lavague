# Hermes Agent Configuration for LA VAGUE Bot

# Copy this to ~/.hermes/config.yaml (Linux/macOS) or %APPDATA%\hermes\config.yaml (Windows)

model:
  default: nvidia/nemotron-3-ultra-550b-a55b
  provider: nvidia
  base_url: https://integrate.api.nvidia.com/v1

database:
  journal_mode: wal

runtime:
  nofile_soft_limit: 4096

agent:
  max_turns: 500
  verbose: false
  reasoning_effort: medium
  personalities: {}

terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300

browser:
  inactivity_timeout: 120

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0

prompt_caching:
  cache_ttl: 5m

display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true

stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ""

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10

delegation:
  max_iterations: 250

skills:
  creation_nudge_interval: 15
  directories:
    - path: C:/Users/Usuario/AppData/Local/hermes/profiles/default/skills

command_allowlist:
  - execute_code
  - script execution via -e/-c flag

kanban:
  review_dispatch: true

code_execution:
  timeout: 300
  max_tool_calls: 50

streaming:
  enabled: false

telemetry:
  shared_metrics:
    enabled: false

updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash

_config_version: 38

session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4

group_sessions_per_user: true

platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat

mcp_servers:
  supabase:
    url: https://zngiyurbqniddexgfvpp.supabase.co/rest/v1
    headers:
      apikey: ${SUPABASE_APIKEY}
      Authorization: Bearer ${SUPABASE_AUTH}
  google-ads: ""

plugins:
  enabled:
    - orca-status

# Discord Platform Configuration
discord:
  bot_token: ${DISCORD_BOT_TOKEN}
  require_mention: true
  free_response_channels: ""
  allowed_channels: ""
  auto_thread: true
  thread_require_mention: false
  bots_require_inline_mention: false
  history_backfill: true
  history_backfill_limit: 50
  missed_message_backfill:
    enabled: false
    channels: ""
    window_seconds: 21600
    limit: 100
    max_dispatches: 10
  reactions: true
  websocket_liveness_interval_seconds: 15
  websocket_liveness_failure_threshold: 2
  websocket_heartbeat_ack_max_age_seconds: 60
  websocket_max_latency_seconds: 30
  channel_prompts: {}
  dm_role_auth_guild: ""
  server_actions: ""
  allow_any_attachment: false
  max_attachment_bytes: 33554432
  approval_mentions: false
  voice_channel_inactivity_timeout_seconds: 300
  voice_playback_timeout_seconds: 120
  voice_fx:
    enabled: false
    ambient_enabled: true
    ambient_path: ""
    ambient_gain: 0.18
    duck_gain: 0.06
    speech_gain: 1.0
    ack_enabled: true
    ack_phrases:
      - "Let me look into that."
      - "One moment."
      - "Checking on that now."
      - "Give me a sec."
      - "On it."

# Gateway Configuration
gateway:
  multiplex_profile_allowlist: null
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  write_sessions_json: true
  scale_to_zero:
    idle_timeout_minutes: 5
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
  platforms:
    discord:
      enabled: true
      bot_token: ${DISCORD_BOT_TOKEN}
      allow_all_users: true